<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login – AceMe</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Inter", sans-serif;
        background: linear-gradient(to bottom right, #e6f9f5, #f9fdfb);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }

      .container {
        background: white;
        padding: 40px;
        border-radius: 15px;
        box-shadow: 0 0 25px rgba(0, 0, 0, 0.05);
        width: 100%;
        max-width: 400px;
        text-align: center;
      }

      h2 {
        margin-bottom: 30px;
        color: #28c99e;
        font-size: 24px;
        font-weight: 700;
      }

      input {
        width: 100%;
        padding: 12px 15px;
        margin: 10px 0;
        border-radius: 8px;
        border: 1px solid #ccc;
        font-size: 15px;
      }

      button {
        width: 100%;
        padding: 12px;
        margin-top: 15px;
        background-color: #28c99e;
        color: white;
        font-size: 16px;
        font-weight: 600;
        border: none;
        border-radius: 8px;
        cursor: pointer;
      }

      button:hover {
        background-color: #23b089;
      }

      .link {
        margin-top: 15px;
        font-size: 14px;
      }

      .link a {
        color: #28c99e;
        text-decoration: none;
        font-weight: 600;
      }

      .link a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Login to AceMe</h2>
      <form id="login-form">
        <input type="email" name="email" placeholder="Email" required />
        <input
          type="password"
          name="password"
          placeholder="Password"
          required
        />
        <button type="submit">Login</button>
      </form>
      <div class="link">
        Not registered? <a href="register.html">Create an account</a>
      </div>
    </div>

    <script src="js/firebase-config.js"></script>
    <script src="js/authAPI.js"></script>
    <script type="module" src="js/storage.js"></script>
    <script>
      document
        .querySelector("#login-form")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const email = e.target
            .querySelector('input[name="email"]')
            .value.trim();
          const password = e.target
            .querySelector('input[name="password"]')
            .value.trim();

          const button = e.target.querySelector("button");
          button.textContent = "Logging in...";
          button.disabled = true;

          try {
            const response = await authAPI.login({ email, password });
            console.log("Login API response 👉", response);
            if (response.success && response.data) {
              const user = response.data.user;
              const token = response.data.token;

              if (!user?.uid) {
                alert("Invalid user data");
                return;
              }

              storage.setUser(user);
              if (token) storage.setToken(token);
              window.location.href = "start.html";
            } else {
              alert(
                "Login failed: " + (response.message || "Invalid credentials")
              );
            }
          } catch (err) {
            console.error("🔥 Login error:", err);
            alert("Login failed: " + err.message);
          } finally {
            button.textContent = "Login";
            button.disabled = false;
          }
        });
    </script>
  </body>
</html>
